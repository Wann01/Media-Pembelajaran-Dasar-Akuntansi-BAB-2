<script>
const titles={
 A:"Profesi dan Peluang Kerja di Bidang Akuntansi dan Keuangan Lembaga",
 B:"Etika Profesi dalam Bidang Akuntansi dan Keuangan Lembaga",
 C:"Pedoman, Prosedur, dan Aturan Kerja pada Industri Jasa Keuangan",
 D:"Peluang Usaha di Bidang Akuntansi dan Keuangan Lembaga"
};
const descriptions={
 A:"Mengenal profesi akuntansi, kualifikasi, asosiasi, gelar, dan peluang kerja.",
 B:"Memahami etika, kode etik, dan prinsip dasar yang harus dijunjung akuntan.",
 C:"Mempelajari pedoman, prosedur, tata kerja, dan sistem kerja jasa keuangan.",
 D:"Mengenal jenis usaha akuntansi dan karakter seorang entrepreneur."
};
const lessons={
A:[
{tab:"Pengertian Profesi",icon:"fa-user-tie",html:`<h3>1. Pengertian Profesi dan Ciri-Ciri Profesi</h3><p>Profesi adalah suatu kegiatan yang dilakukan atas dasar keahlian, keterampilan, dan pengetahuan yang dimiliki seseorang sesuai dengan bidangnya. Menurut Perpres No. 8 Tahun 2012 Pasal 1 ayat (8) tentang Kerangka Kualifikasi Nasional Indonesia, profesi adalah bidang pekerjaan yang memiliki kompetensi tertentu yang diakui oleh masyarakat.</p><p>Pemilik profesi umumnya memiliki ijazah sesuai bidangnya atau sertifikat tertentu untuk memenuhi kualifikasi. Mereka juga mempunyai komitmen serta siap mengikuti aturan, pedoman, dan kode etik profesinya.</p><div class="callout"><b>Perbedaan penting:</b> Profesi menuntut keahlian atau kompetensi tertentu, sedangkan pekerjaan merupakan aktivitas untuk memenuhi kebutuhan yang tidak selalu mensyaratkan keahlian, ijazah, atau sertifikat khusus.</div><div class="table-wrap"><table><tr><th>Profesi</th><th>Pekerjaan</th></tr><tr><td>Berlandaskan keahlian, keterampilan, dan pengetahuan tertentu.</td><td>Aktivitas untuk memenuhi kebutuhan hidup.</td></tr><tr><td>Memiliki kualifikasi/kompetensi yang diakui.</td><td>Tidak selalu membutuhkan ijazah atau sertifikat khusus.</td></tr><tr><td>Contoh: guru, dokter, perawat, akuntan, teller bank.</td><td>Contoh dalam buku: petani, nelayan, tukang, pedagang.</td></tr></table></div><h4>Ciri-ciri umum profesi</h4><ol><li>Menuntut keterampilan khusus.</li><li>Mempunyai komitmen moral.</li><li>Mengandalkan hidup dari profesi.</li><li>Mengabdi pada masyarakat.</li><li>Mempunyai izin untuk praktik.</li><li>Memiliki organisasi profesi.</li></ol>`},
{tab:"Jenis Profesi",icon:"fa-calculator",html:`<h3>2. Jenis dan Peran Profesi Akuntansi</h3><p>Menurut PMK No. 25 Tahun 2014, profesi di bidang akuntansi dan keuangan terdiri dari akuntan dan teknisi akuntansi. Pembinaannya dilakukan oleh Pusat Pembinaan Profesi Keuangan (PPPK) di bawah Kementerian Keuangan. Profesi lain yang dibina PPPK antara lain penilai publik dan aktuaris.</p><div class="info-grid"><div class="info-tile"><b><i class="fa-solid fa-user-tie"></i> Akuntan</b><p>Sebutan dan gelar profesional bagi seseorang yang menempuh pendidikan tinggi akuntansi, lulus PPAk, dan ujian profesi akuntan sesuai ketentuan.</p></div><div class="info-tile"><b><i class="fa-solid fa-keyboard"></i> Teknisi Akuntansi</b><p>Tenaga pelaksana pembukuan di perusahaan, instansi pemerintah, atau pendidikan sesuai jenjang kualifikasi kerjanya.</p></div></div><h4>Jenis akuntan berdasarkan bidang kerja</h4><ol><li>Akuntan publik.</li><li>Akuntan pemerintah.</li><li>Akuntan pendidik.</li><li>Akuntan internal.</li><li>Akuntan syariah.</li><li>Akuntan pajak.</li><li>Akuntan manajemen.</li></ol><div class="callout">Penilai publik memberikan jasa penilaian properti dan bisnis. Aktuaris memberikan jasa konsultasi terkait asuransi, dana pensiun, dan manajemen risiko.</div>`},
{tab:"Jenjang Teknisi",icon:"fa-stairs",html:`<h3>3. Jenjang Kualifikasi Teknisi Akuntansi</h3><p>Teknisi akuntansi memiliki jenjang kualifikasi kerja berdasarkan SKKNI No. 182 Tahun 2013 untuk bidang jasa akuntansi, pembukuan, pemeriksa, dan konsultan pajak.</p><div class="table-wrap"><table><tr><th>Jenjang</th><th>Level</th><th>Kualifikasi pendidikan dan kemampuan</th></tr><tr><td>Teknisi Akuntansi Yunior</td><td>II</td><td>Lulusan pendidikan menengah/SMK; memproses entri jurnal dan buku besar, menyusun laporan keuangan manual berbasis SAK ETAP, serta menjadi operator aplikasi komputer akuntansi.</td></tr><tr><td>Teknisi Akuntansi Pratama</td><td>III</td><td>Lulusan D-I vokasi akuntansi; bekerja pada entitas jasa/dagang kecil atau menengah.</td></tr><tr><td>Teknisi Akuntansi Muda</td><td>IV</td><td>Lulusan D-II vokasi akuntansi; bekerja pada entitas menengah dan/atau ETAP.</td></tr><tr><td>Teknisi Akuntansi Madya</td><td>V</td><td>Lulusan D-III vokasi akuntansi; mampu menangani entitas besar dan/atau go-public.</td></tr><tr><td>Teknisi Akuntansi Ahli</td><td>VI</td><td>Lulusan S1 Akuntansi/D-IV; memiliki keahlian spesifik seperti sektor publik, manajemen, perpajakan, sistem informasi, atau syariah.</td></tr></table></div><div class="callout">Dalam pembagian jabatan pada Perpres No. 8 Tahun 2012, jenjang 1–3 adalah operator, jenjang 4–6 teknisi/analis, dan jenjang 7–9 ahli. Lulusan SMK yang berada pada kualifikasi level 2 memiliki jabatan operator.</div>`},
{tab:"Asosiasi & Gelar",icon:"fa-award",html:`<h3>4. Asosiasi Profesi, Gelar, dan Jabatan</h3><p>Asosiasi profesi menjadi wadah pengembangan kompetensi teknis dan etis bagi para anggota profesi.</p><h4>Asosiasi profesi dalam bidang akuntansi dan keuangan</h4><ul><li>Ikatan Akuntan Indonesia (IAI).</li><li>Institut Akuntan Manajemen Indonesia (IAMI).</li><li>Institut Akuntan Publik Indonesia (IAPI).</li><li>Masyarakat Teknisi Akuntansi (MATA) Indonesia.</li><li>Persatuan Aktuaris Indonesia (PAI).</li><li>Asosiasi Aktuaria Indonesia (AKAI).</li><li>Masyarakat Profesi Penilai Indonesia (MAPPI).</li><li>Asosiasi Konsultan Aktuaria Indonesia (AKAI).</li></ul><h4>Contoh gelar/sertifikasi profesi</h4><div class="table-wrap"><table><tr><th>Sertifikasi</th><th>Penerbit/keterangan</th></tr><tr><td>Chartered Accountant (CA)</td><td>IAI</td></tr><tr><td>Sertifikasi Akuntan Syariah (SAS)</td><td>IAI</td></tr><tr><td>Certified Public Accountant (CPA)</td><td>IAPI</td></tr><tr><td>CAAT</td><td>MATA Indonesia untuk teknisi yunior dan muda</td></tr><tr><td>CAT</td><td>MATA Indonesia untuk teknisi madya</td></tr><tr><td>CPAT</td><td>MATA Indonesia untuk teknisi ahli</td></tr><tr><td>CAP</td><td>Certified Accurate Profesional bagi operator aplikasi Accurate</td></tr></table></div>`},
{tab:"Peluang Kerja",icon:"fa-briefcase",html:`<h3>5. Peluang Kerja di Bidang Akuntansi</h3><p>Peluang kerja bagi lulusan akuntansi tersedia pada sektor privat, perpajakan, kantor jasa akuntan, BUMDes, dan berbagai lembaga.</p><div class="info-grid"><div class="info-tile"><b>Kualifikasi Level II</b><p>Operator aplikasi komputer akuntansi, teller bank/lembaga keuangan, kasir, staf akuntan publik, accounting officer/staf akuntansi, account officer, tax officer, budgeting officer, operator sistem keuangan desa, kaur keuangan desa, dan tenaga administrasi keuangan lembaga pemerintah.</p></div><div class="info-tile"><b>Kualifikasi Level III–VI</b><p>Asisten/junior auditor, auditor, financial analyst, accounting manager, accounting software developer, dan credit analysis manager.</p></div></div><div class="callout"><b>Contoh dunia kerja:</b> Lulusan SMK Akuntansi dapat membantu pencatatan transaksi dan penyusunan laporan keuangan BUMDes atau UMKM. Keterampilan pembukuan dan pemahaman standar laporan menjadi bekal penting.</div><div class="activity"><h4><i class="fa-solid fa-people-group"></i> Aktivitas: Pilih profesi impianmu</h4><p>Jika kamu lulus dari SMK Akuntansi, pekerjaan apa yang paling ingin kamu tekuni? Pilih satu dan lihat gambaran tugasnya.</p><select id="careerPick" style="padding:9px;border:1px solid #dfc9e5;border-radius:9px;width:100%;font:inherit;font-size:11px"><option value="">Pilih profesi...</option><option value="Teller bank: melayani transaksi nasabah dan mencatat transaksi sesuai prosedur.">Teller bank</option><option value="Staf akuntansi: mencatat transaksi, melakukan pembukuan, dan membantu laporan keuangan.">Staf akuntansi</option><option value="Staf pajak: membantu administrasi dan pelaporan kewajiban perpajakan.">Staf pajak</option><option value="Auditor: memeriksa bukti dan informasi keuangan secara sistematis.">Auditor</option><option value="Financial analyst: menganalisis informasi keuangan untuk membantu pengambilan keputusan.">Financial analyst</option></select><button onclick="careerActivity()" style="margin-top:9px">Lihat gambaran tugas</button><div class="activity-result" id="careerResult"></div></div>`}
],
B:[
{tab:"Pengertian Etika",icon:"fa-book-open",html:`<h3>1. Pengertian Etika</h3><p>Etika merupakan aturan atau pedoman mengenai sikap, perilaku, dan tindakan manusia dalam hidup bermasyarakat yang berlaku secara universal. Etika mengatur baik atau buruknya tindakan manusia berdasarkan aturan dan norma yang berlaku.</p><div class="callout">Dalam pekerjaan akuntansi, etika membantu seseorang menentukan tindakan yang benar ketika menghadapi pilihan atau tekanan dalam pekerjaan.</div><h4>Etika profesi</h4><p>Etika profesi adalah konsep etika yang ditetapkan atau disepakati dalam ruang lingkup profesi atau pekerjaan tertentu. Etika profesi menjadi aturan atau pedoman untuk memenuhi kebutuhan pelayanan profesional kepada klien.</p><p>Etika profesi dalam bidang akuntansi merupakan pedoman bagi seluruh anggota akuntan dan teknisi akuntansi, baik yang bekerja sebagai akuntan publik, di perusahaan, instansi pemerintah, maupun lingkungan pendidikan.</p>`},
{tab:"Kode Etik",icon:"fa-scale-balanced",html:`<h3>2. Kode Etik Profesi</h3><p>Kode etik profesi adalah pedoman yang disepakati untuk mengatur tingkah laku moral kelompok profesi tertentu dalam melaksanakan tugas sehari-hari. Kode etik menetapkan standar perilaku etis yang diharapkan dari setiap anggota profesi.</p><p>Akuntan dan teknisi akuntansi sangat bergantung pada kepercayaan masyarakat. Karena itu, mereka harus menjunjung tinggi etika. Penyimpangan seperti kolusi, korupsi, dan nepotisme dapat merusak kepercayaan terhadap profesi.</p><h4>Tujuan dan pentingnya kode etik</h4><ul><li>Menetapkan standar perilaku etis anggota profesi.</li><li>Menjaga mutu perilaku profesional akuntan.</li><li>Menjaga kepercayaan masyarakat terhadap profesi.</li><li>Menjadi pedoman saat menjalankan tanggung jawab profesional.</li></ul><div class="callout">Kode etik bukan sekadar aturan tertulis. Kode etik harus menjadi pedoman dalam keputusan dan tindakan sehari-hari.</div>`},
{tab:"Prinsip Etika",icon:"fa-shield-heart",html:`<h3>3. Prinsip Kode Etik Profesi Akuntan Menurut IAI</h3><div class="info-grid"><div class="info-tile"><b>1. Integritas</b><p>Bersikap lugas dan jujur dalam semua hubungan profesional dan bisnis.</p></div><div class="info-tile"><b>2. Objektivitas</b><p>Menggunakan pertimbangan profesional tanpa bias, benturan kepentingan, atau pengaruh yang tidak semestinya.</p></div><div class="info-tile"><b>3. Kompetensi dan kehati-hatian profesional</b><p>Mempertahankan pengetahuan dan keahlian yang diperlukan serta bertindak sungguh-sungguh sesuai standar profesional dan teknis.</p></div><div class="info-tile"><b>4. Kerahasiaan</b><p>Menjaga informasi yang diperoleh dari hubungan profesional dan bisnis.</p></div><div class="info-tile"><b>5. Perilaku profesional</b><p>Mematuhi peraturan perundang-undangan, bertindak demi kepentingan publik, dan menghindari tindakan yang mendiskreditkan profesi.</p></div></div>`},
{tab:"Kasus Etika",icon:"fa-handshake",html:`<h3>4. Studi Kasus: Akuntan Ditawari Suap</h3><p>Seorang akuntan sedang memeriksa laporan keuangan klien. Klien menawarkan sejumlah uang agar akuntan mengubah hasil pemeriksaan dan menyembunyikan kesalahan pencatatan.</p><div class="callout"><b>Pertanyaan:</b> Apa tindakan yang seharusnya dilakukan akuntan tersebut?</div><div class="info-grid"><div class="info-tile"><b>Tindakan yang benar</b><p>Menolak tawaran suap, tetap menyampaikan hasil pemeriksaan secara jujur, menjaga bukti dan informasi sesuai ketentuan, serta mengikuti prosedur pelaporan yang berlaku.</p></div><div class="info-tile"><b>Prinsip yang diterapkan</b><p>Integritas karena jujur; objektivitas karena tidak dipengaruhi klien; perilaku profesional karena mematuhi aturan profesi.</p></div></div><div class="activity"><h4><i class="fa-solid fa-comments"></i> Aktivitas: Uji keputusan etis</h4><p>Jika klien meminta kamu mengubah angka agar laporan terlihat lebih baik, apa yang kamu lakukan?</p><button onclick="caseAnswer(1)">Menolak dan mempertahankan data yang benar</button> <button onclick="caseAnswer(0)" style="background:#bd789d">Mengubah angka sesuai permintaan</button><div class="activity-result" id="caseResult"></div></div>`}
],
C:[
{tab:"Industri Jasa Keuangan",icon:"fa-building-columns",html:`<h3>1. Industri Jasa Keuangan</h3><p>Industri jasa keuangan meliputi semua badan yang melakukan kegiatan di bidang keuangan, baik secara langsung maupun tidak langsung, dengan memberikan pelayanan keuangan kepada konsumen, pelaku bisnis, dan lembaga keuangan lainnya.</p><h4>Ciri-ciri industri jasa keuangan</h4><ol><li>Tidak melakukan transaksi pembelian barang dagangan untuk dijual kembali.</li><li>Tidak memproduksi dan menjual barang.</li><li>Tidak memiliki persediaan bahan baku.</li><li>Mayoritas pengeluaran digunakan untuk operasional gaji karyawan.</li><li>Komponen aset terdiri dari kas, piutang, dan aset tetap.</li></ol><h4>Contoh lembaga</h4><div class="info-grid"><div class="info-tile"><b><i class="fa-solid fa-building-columns"></i> Perbankan</b><p>Bank dan perusahaan kartu kredit.</p></div><div class="info-tile"><b><i class="fa-solid fa-shield-halved"></i> Perlindungan keuangan</b><p>Perusahaan asuransi dan lembaga penjamin simpanan.</p></div><div class="info-tile"><b><i class="fa-solid fa-hand-holding-dollar"></i> Pembiayaan</b><p>Perusahaan pembiayaan konsumen dan koperasi simpan pinjam.</p></div><div class="info-tile"><b><i class="fa-solid fa-chart-line"></i> Investasi & masa depan</b><p>Lembaga dana pensiun dan perusahaan pasar modal.</p></div></div>`},
{tab:"Pedoman Kerja",icon:"fa-book",html:`<h3>2. Pedoman Kerja pada Industri Jasa Keuangan</h3><p>Pedoman kerja adalah standar atau pedoman tertulis yang digunakan untuk memandu suatu kelompok dalam mencapai tujuan perusahaan. Dalam industri jasa keuangan, pedoman kerja menjadi dasar pelaksanaan kegiatan usaha.</p><h4>Fungsi pedoman kerja</h4><ol><li>Sebagai dasar hukum bila terjadi penyimpangan dalam aktivitas kerja.</li><li>Mengarahkan karyawan agar bersama-sama disiplin dalam bekerja.</li><li>Menjadi petunjuk dan arahan dalam menjalankan pekerjaan sesuai bidangnya.</li></ol><div class="callout">Contoh: petugas layanan bank menggunakan pedoman tertulis untuk memastikan pelayanan kepada nasabah dilakukan secara tertib dan sesuai ketentuan lembaga.</div>`},
{tab:"Prosedur & SOP",icon:"fa-list-check",html:`<h3>3. Prosedur Kerja dan Standard Operating Procedure (SOP)</h3><p>Prosedur kerja adalah rangkaian tata kerja yang saling berkaitan sehingga menunjukkan urutan langkah dan instruksi yang harus ditempuh karyawan untuk menyelesaikan pekerjaan tertentu. Standar prosedur kerja dikenal sebagai Standard Operating Procedure (SOP).</p><p>SOP yang baik mengatur cara melakukan pekerjaan, siapa yang mengerjakan, siapa yang bertanggung jawab, alat/perlengkapan yang digunakan, dan hasil pekerjaan.</p><h4>Contoh SOP pada industri jasa keuangan</h4><ul><li>SOP Pembukaan Rekening Tabungan.</li><li>SOP Pengajuan Kredit.</li><li>SOP Pencairan Pinjaman.</li><li>SOP Pencairan Pembiayaan.</li><li>SOP Penyusunan Laporan Keuangan.</li></ul><h4>Contoh SOP penyusunan laporan keuangan dalam buku</h4><div class="table-wrap"><table><tr><th>Proses</th><th>Instruksi kerja</th><th>Output</th></tr><tr><td>Mencatat jurnal penyesuaian</td><td>Sediakan dokumen sumber penyesuaian; identifikasi akun yang perlu disesuaikan; catat jurnal penyesuaian.</td><td>Jurnal penyesuaian tercatat.</td></tr><tr><td>Menyajikan laporan</td><td>Sajikan laporan laba rugi, posisi keuangan, perubahan ekuitas, dan arus kas sesuai SOP/SAK/SAK ETAP.</td><td>Laporan keuangan lengkap.</td></tr></table></div>`},
{tab:"Tata & Sistem Kerja",icon:"fa-gears",html:`<h3>4. Tata Kerja dan Sistem Kerja</h3><div class="info-grid"><div class="info-tile"><b>Tata Kerja</b><p>Cara-cara melaksanakan pekerjaan secara efisien dengan mempertimbangkan tujuan, sarana prasarana, rekan kerja, waktu, dan hal lain.</p></div><div class="info-tile"><b>Sistem Kerja</b><p>Rangkaian tata kerja dan prosedur kerja yang membentuk pola untuk melaksanakan satu pekerjaan.</p></div></div><h4>Hubungan ketiganya</h4><p>Prosedur kerja, tata kerja, dan sistem kerja tidak dapat berdiri sendiri. Ketiganya saling terkait dan menjadi panduan bagi pelaksana serta pihak yang berkepentingan.</p><div class="activity"><h4><i class="fa-solid fa-diagram-project"></i> Simulasi alur SOP penyusunan laporan</h4><p>Tekan tombol berikut untuk menjalankan tahapan sesuai contoh dalam buku.</p><button onclick="runSop()">Mulai simulasi SOP</button><div class="activity-result" id="sopResult"></div></div>`}
],
D:[
{tab:"Peluang Usaha",icon:"fa-lightbulb",html:`<h3>1. Peluang Usaha di Bidang Akuntansi dan Keuangan Lembaga</h3><p>Bidang akuntansi dan keuangan lembaga menjadi salah satu bidang bisnis yang cukup menjanjikan karena berhubungan dengan kebutuhan masyarakat terhadap jasa akuntansi dan keuangan.</p><h4>Jenis usaha jasa yang dapat dikembangkan</h4><div class="info-grid"><div class="info-tile"><b><i class="fa-solid fa-calculator"></i> Konsultan jasa akuntansi</b><p>Membantu pencatatan transaksi dan penyusunan laporan keuangan.</p></div><div class="info-tile"><b><i class="fa-solid fa-magnifying-glass-chart"></i> Jasa audit</b><p>Memberikan jasa pemeriksaan informasi atau laporan keuangan.</p></div><div class="info-tile"><b><i class="fa-solid fa-file-invoice-dollar"></i> Konsultan pajak</b><p>Membantu administrasi dan pelaporan perpajakan.</p></div><div class="info-tile"><b><i class="fa-solid fa-chalkboard-user"></i> Lembaga pelatihan</b><p>Menyelenggarakan pelatihan keterampilan akuntansi.</p></div><div class="info-tile"><b><i class="fa-solid fa-laptop-code"></i> Pengembang software</b><p>Mengembangkan aplikasi komputer akuntansi.</p></div><div class="info-tile"><b><i class="fa-solid fa-building-columns"></i> Lembaga keuangan</b><p>Menyediakan layanan keuangan bagi masyarakat.</p></div></div><div class="callout">Lulusan SMK dapat mengembangkan jasa konsultasi akuntansi bagi UMKM, pendampingan penggunaan aplikasi komputer akuntansi, dan jasa pelaporan SPT bagi UMKM.</div>`},
{tab:"Entrepreneur",icon:"fa-user-astronaut",html:`<h3>2. Profil Entrepreneur Bidang Akuntansi</h3><p>Entrepreneur adalah orang yang membangun dan mengembangkan usaha. Untuk menjadi entrepreneur yang sukses di bidang jasa, buku menjelaskan sejumlah karakter yang perlu dimiliki.</p><h4>Karakter entrepreneur menurut buku</h4><ol><li>Percaya diri, jujur, sabar, dan tidak mudah putus asa.</li><li>Disiplin, bertanggung jawab, dan kreatif.</li><li>Berorientasi pada kinerja dan hasil.</li><li>Mampu memberikan pelayanan prima kepada pelanggan.</li><li>Berani mengambil risiko.</li></ol><div class="callout">Mindset entrepreneur dibangun sejak dini melalui komitmen, kejujuran, sikap realistis, kemandirian, dan kedisiplinan.</div>`},
{tab:"Simulasi Usaha",icon:"fa-store",html:`<h3>3. Simulasi Usaha Jasa Pembukuan UMKM</h3><p>Contoh berikut merupakan simulasi sederhana untuk memahami bagaimana lulusan akuntansi dapat menawarkan jasa pembukuan kepada UMKM. Angka merupakan ilustrasi latihan, bukan data dari buku.</p><div class="activity"><h4><i class="fa-solid fa-calculator"></i> Kalkulator simulasi pendapatan jasa</h4><label style="display:block;font-size:11px;margin:8px 0 4px">Jumlah klien UMKM</label><input id="clients" type="number" min="1" value="5" style="width:100%;padding:10px;border:1px solid #e5cddd;border-radius:9px;font:inherit"><label style="display:block;font-size:11px;margin:10px 0 4px">Biaya jasa per klien (Rp/bulan)</label><input id="fee" type="number" min="0" value="300000" step="50000" style="width:100%;padding:10px;border:1px solid #e5cddd;border-radius:9px;font:inherit"><button onclick="calcBusiness()" style="margin-top:12px">Hitung pendapatan</button><div class="activity-result" id="businessResult"></div></div><p><b>Contoh layanan:</b> mencatat pemasukan dan pengeluaran, mengelompokkan bukti transaksi, membuat rekap bulanan, serta membantu pemilik usaha memahami kondisi keuangan.</p>`}
]

["Dalam contoh SOP buku, proses menyajikan laporan meliputi ...",["Laba rugi, posisi keuangan, perubahan ekuitas, dan arus kas","Daftar hadir dan jadwal piket","Daftar harga dan stok barang","Surat penawaran dan faktur penjualan"],0,"Keempat laporan tersebut tercantum dalam contoh SOP penyusunan laporan keuangan."]
],

["Lulusan SMK dapat membantu UMKM melalui ...",["Pendampingan aplikasi akuntansi dan jasa pelaporan SPT","Pembuatan mesin industri","Jasa pengiriman barang","Produksi bahan baku"],0,"Buku menyebut jasa konsultasi akuntansi UMKM, pendampingan aplikasi, dan pelaporan SPT."],

["Berorientasi pada kinerja dan hasil merupakan ...",["Karakter entrepreneur","Jenis laporan keuangan","Prosedur audit","Bentuk pajak"],0,"Berorientasi pada kinerja dan hasil termasuk karakter entrepreneur."],
["Dalam simulasi usaha pembukuan UMKM, layanan yang sesuai adalah ...",["Mencatat pemasukan dan pengeluaran","Mengubah data agar untung besar","Menyembunyikan transaksi","Menghapus bukti transaksi"],0,"Jasa pembukuan membantu mencatat transaksi dan merangkum informasi keuangan."]

let state=JSON.parse(localStorage.getItem("akuntansiBab2Progress")||'{"completed":{},"scores":{},"attempted":{}}');
let current="dashboard",tabIndex=0,quizIndex=0,selected=null,answered=false;
const view=document.getElementById("view");
function save(){localStorage.setItem("akuntansiBab2Progress",JSON.stringify(state));}
function toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300)}
function progress(){let done=Object.values(state.completed).filter(Boolean).length;return Math.round(done/4*100)}
function nav(page){current=page;tabIndex=0;quizIndex=0;selected=null;answered=false;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("crumb").textContent=page==="dashboard"?"Dashboard":page==="video"?"Video Rangkuman":page==="progress"?"Evaluasi Progres":"Bagian "+page;document.getElementById("sidebar").classList.remove("open");render()}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>nav(b.dataset.page)));
document.getElementById("menuBtn").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
document.getElementById("sidebarToggle").onclick=()=>{const app=document.querySelector(".app");app.classList.toggle("sidebar-collapsed");const collapsed=app.classList.contains("sidebar-collapsed");document.querySelector("#sidebarToggle i").className=collapsed?"fa-solid fa-angles-right":"fa-solid fa-angles-left";document.getElementById("sidebarToggle").title=collapsed?"Tampilkan sidebar":"Minimize sidebar";localStorage.setItem("sidebarCollapsed",collapsed?"1":"0")};
if(localStorage.getItem("sidebarCollapsed")==="1"){document.querySelector(".app").classList.add("sidebar-collapsed");document.querySelector("#sidebarToggle i").className="fa-solid fa-angles-right";document.getElementById("sidebarToggle").title="Tampilkan sidebar"}
function render(){
 if(current==="dashboard")renderDashboard();
 else if(current==="video")renderVideo();
 else if(current==="progress")renderProgress();
 else renderLesson(current);
}
function renderDashboard(){
 const done=Object.values(state.completed).filter(Boolean).length,attempt=Object.keys(state.attempted).length;
 view.innerHTML=`<div class="hero"><div><span class="eyebrow"><i class="fa-solid fa-graduation-cap"></i> SMK/MAK KELAS X · BAB II</span><h1>Profesi Akuntan dan<br>Etika Profesi</h1><p>Selamat datang di Akuntansi Learning! Pelajari profesi akuntansi, etika profesi, pedoman kerja industri jasa keuangan, serta peluang usaha melalui materi dan kuis interaktif.</p><button class="btn btn-primary" onclick="nav('A')">Mulai Belajar <i class="fa-solid fa-arrow-right"></i></button></div><div class="hero-art"><div class="hero-character">👩🏻‍🏫</div><div class="float-card one">📚 Belajar Aktif</div><div class="float-card two">🧮 Akuntansi</div></div></div>
 <div class="stats"><div class="stat"><div class="stat-icon"><i class="fa-solid fa-book-open"></i></div><div><strong>${done}/4</strong><span>Materi selesai</span></div></div><div class="stat"><div class="stat-icon"><i class="fa-solid fa-clipboard-check"></i></div><div><strong>${attempt}/4</strong><span>Kuis dikerjakan</span></div></div><div class="stat"><div class="stat-icon"><i class="fa-solid fa-chart-pie"></i></div><div><strong>${progress()}%</strong><span>Progress belajar</span></div></div></div>
 <div class="progress-card"><div class="progress-top"><span>Progress pembelajaran</span><span>${progress()}%</span></div><div class="bar"><span style="width:${progress()}%"></span></div></div>
 <div class="section-head"><div><h2>Menu Pembelajaran</h2><p>Pilih bagian materi yang ingin kamu pelajari.</p></div></div>
 <div class="cards">${["A","B","C","D"].map((k,i)=>`<article class="lesson-card"><div class="card-top"><span class="letter">${k}</span><span class="card-icon"><i class="fa-solid ${["fa-briefcase","fa-scale-balanced","fa-clipboard-list","fa-lightbulb"][i]}"></i></span></div><h3>${titles[k]}</h3><p>${descriptions[k]}</p><span class="tag">Materi + Kuis</span><div class="card-bottom"><span class="status ${state.completed[k]?"done":""}">${state.completed[k]?"✓ Materi selesai":"○ Belum selesai"}</span><button class="btn btn-primary" onclick="nav('${k}')">Pelajari <i class="fa-solid fa-arrow-right"></i></button></div></article>`).join("")}</div>
 <div class="video-panel"><div class="video-title"><i class="fa-solid fa-play"></i> Video Rangkuman BAB II</div><p class="video-desc">Tonton video rangkuman setelah mempelajari seluruh bagian A sampai D.</p><button class="btn btn-light" onclick="nav('video')">Buka Video Rangkuman <i class="fa-solid fa-arrow-right"></i></button></div>`;
}
function renderLesson(k){
 const arr=lessons[k],lesson=arr[Math.min(tabIndex,arr.length-1)];
 view.innerHTML=`<div class="learning-banner"><div><span class="eyebrow">BAB II · BAGIAN ${k}</span><h2>${titles[k]}</h2><p>${descriptions[k]}</p></div><div class="banner-emoji">${{A:"💼",B:"⚖️",C:"📋",D:"💡"}[k]}</div></div>
 <div class="content-card"><h3><i class="fa-solid ${lesson.icon}"></i> ${lesson.tab}</h3>${lesson.html}</div>
 <div class="tabs">${arr.map((x,i)=>`<button class="${i===tabIndex?"active":""}" onclick="setTab(${i})">${i+1}. ${x.tab}</button>`).join("")}<button class="${tabIndex===arr.length?"active":""}" onclick="setTab(${arr.length})"><i class="fa-solid fa-circle-question"></i> Kuis ${k}</button></div>
 ${tabIndex===arr.length?quizMarkup(k):`<div class="page-controls"><button class="btn btn-light" ${tabIndex===0?"disabled":""} onclick="setTab(${tabIndex-1})"><i class="fa-solid fa-arrow-left"></i> Sebelumnya</button><button class="btn btn-primary" onclick="setTab(${tabIndex+1})">Selanjutnya <i class="fa-solid fa-arrow-right"></i></button></div>`}
 <div class="page-controls"><button class="btn btn-light" onclick="nav('${k==="A"?"dashboard":["A","B","C","D"]["ABCD".indexOf(k)-1]}')"><i class="fa-solid fa-arrow-left"></i> ${k==="A"?"Dashboard":"Materi sebelumnya"}</button><button class="btn btn-primary" onclick="markDone('${k}')">Tandai Materi Selesai <i class="fa-solid fa-check"></i></button></div>`;
}
function setTab(i){tabIndex=i;renderLesson(current);window.scrollTo({top:0,behavior:"smooth"})}
function markDone(k){state.completed[k]=true;save();toast("Bagian "+k+" ditandai selesai.");renderLesson(k)}
function quizMarkup(k){
 const q=quizzes[k][quizIndex],total=quizzes[k].length,score=state.scores[k];
 if(state.attempted[k]&&quizIndex===0&&window.showQuizResult){return resultMarkup(k)}
 return `<div class="quiz-card"><div class="quiz-header"><h3><i class="fa-solid fa-trophy" style="color:#e6a52e"></i> Kuis Bagian ${k}</h3><span class="tag">Soal ${quizIndex+1} dari ${total}</span></div><div class="bar" style="margin-top:13px"><span style="width:${(quizIndex+1)/total*100}%"></span></div><div class="quiz-question">${q[0]}</div><div class="options">${q[1].map((a,i)=>`<button class="option ${selected===i?"selected":""}" ${answered?"disabled":""} onclick="choose(${i})"><span class="opt-letter">${"ABCD"[i]}</span><span>${a}</span></button>`).join("")}</div><div class="feedback ${answered?(selected===q[2]?"good":"bad"):""}" style="${answered?"display:block":""}">${answered?(selected===q[2]?"✓ Jawaban benar! ":"✗ Jawaban belum tepat. ") + q[3]:""}</div><div class="quiz-actions"><button class="btn btn-light" onclick="resetQuizQuestion()" ${quizIndex===0?"disabled":""}>Kembali</button>${answered?`<button class="btn btn-primary" onclick="nextQuestion('${k}')">${quizIndex===total-1?"Lihat Hasil":"Soal Berikutnya"} <i class="fa-solid fa-arrow-right"></i></button>`:`<button class="btn btn-primary" onclick="submitAnswer('${k}')" ${selected===null?"disabled":""}>Periksa Jawaban</button>`}</div></div><div class="callout">Pilih satu jawaban terbaik. Setiap jawaban benar bernilai 20 poin.</div>`;
}
let answers={};
function choose(i){if(answered)return;selected=i;renderLesson(current)}
function submitAnswer(k){if(selected===null)return;answered=true;(answers[k]??=[])[quizIndex]=selected;renderLesson(k)}
function resetQuizQuestion(){if(quizIndex>0){quizIndex--;selected=answers[current]?.[quizIndex]??null;answered=selected!==null;renderLesson(current)}}
function nextQuestion(k){if(quizIndex<quizzes[k].length-1){quizIndex++;selected=null;answered=false;renderLesson(k)}else{let correct=answers[k].filter((a,i)=>a===quizzes[k][i][2]).length;state.scores[k]=correct*20;state.attempted[k]=true;save();window.showQuizResult=true;renderLesson(k)}}
function resultMarkup(k){let correct=state.scores[k]/20;return `<div class="quiz-result" style="display:block"><h4>Hasil Kuis Bagian ${k}</h4><div class="score">${state.scores[k]}</div><p>Benar: ${correct} · Salah: ${5-correct}<br>Predikat: ${state.scores[k]>=80?"Sangat Baik":state.scores[k]>=60?"Baik":state.scores[k]>=40?"Cukup":"Perlu belajar lagi"}</p><p style="font-size:11px">Pelajari kembali pembahasan pada setiap soal, lalu ulangi kuis untuk meningkatkan pemahaman.</p><button class="btn btn-primary" onclick="retryQuiz('${k}')">Ulangi Kuis</button></div>`}
function retryQuiz(k){delete state.attempted[k];delete state.scores[k];delete answers[k];window.showQuizResult=false;quizIndex=0;selected=null;answered=false;renderLesson(k)}
function careerActivity(){let v=document.getElementById("careerPick").value;let r=document.getElementById("careerResult");r.style.display="block";r.textContent=v||"Silakan pilih salah satu profesi terlebih dahulu."}
function caseAnswer(ok){let r=document.getElementById("caseResult");r.style.display="block";r.textContent=ok?"Tepat! Menolak suap dan mempertahankan data yang benar menunjukkan integritas dan objektivitas.":"Keputusan tersebut melanggar integritas dan objektivitas. Akuntan harus menolak suap dan menyajikan hasil secara jujur."}
function runSop(){let r=document.getElementById("sopResult");r.style.display="block";r.innerHTML="<b>Alur SOP:</b><br>1. Sediakan dokumen sumber penyesuaian.<br>↓<br>2. Identifikasi akun-akun yang memerlukan penyesuaian.<br>↓<br>3. Catat jurnal penyesuaian.<br>↓<br>4. Sajikan laporan laba rugi dan laporan posisi keuangan.<br>↓<br>5. Sajikan laporan perubahan ekuitas dan laporan arus kas.<br><br><b>Output:</b> laporan keuangan yang terdiri dari empat laporan tersebut."}
function calcBusiness(){let n=Math.max(0,Number(document.getElementById("clients").value)||0),f=Math.max(0,Number(document.getElementById("fee").value)||0);let fmt=new Intl.NumberFormat("id-ID");let r=document.getElementById("businessResult");r.style.display="block";r.innerHTML=`Perkiraan pendapatan jasa per bulan:<br><b style="font-size:17px;color:#8d174f">Rp${fmt.format(n*f)}</b><br>${n} klien × Rp${fmt.format(f)}. Ini pendapatan kotor sebelum biaya operasional.`}
function renderVideo(){view.innerHTML=`<div class="learning-banner"><div><span class="eyebrow">PENUTUP PEMBELAJARAN</span><h2>VIDEO RANGKUMAN BAB II</h2><p>Perkuat pemahamanmu tentang profesi akuntan, etika profesi, pedoman kerja, dan peluang usaha.</p></div><div class="banner-emoji">🎬</div></div><div class="video-panel"><div class="video-title"><i class="fa-solid fa-play"></i> Video Pembelajaran BAB II</div><div class="video-frame"><iframe src="https://drive.google.com/file/d/1C-eIGSPHmufFGPjfkcy9IVQkfgX3AK6b/preview" allow="autoplay; fullscreen" allowfullscreen title="Video Rangkuman BAB II"></iframe></div><p class="video-desc">Video diputar langsung dari Google Drive. Gunakan kontrol pada pemutar untuk Play, Pause, mengatur volume, dan fullscreen. Jika video tidak tampil, pastikan akses file Google Drive diatur menjadi <b>Anyone with the link — Viewer</b>.</p></div><div class="content-card" style="margin-top:18px"><h3>Rangkuman pembelajaran</h3><ul><li>Bagian A membahas profesi, jenis akuntan, teknisi akuntansi, asosiasi, gelar, dan peluang kerja.</li><li>Bagian B membahas etika, kode etik, dan lima prinsip dasar etika akuntan.</li><li>Bagian C membahas industri jasa keuangan, pedoman, SOP, tata kerja, dan sistem kerja.</li><li>Bagian D membahas peluang usaha jasa akuntansi dan karakter entrepreneur.</li></ul><div class="callout">Terus kembangkan kompetensi, jaga kejujuran, dan jadikan ilmu akuntansi sebagai bekal untuk berkarya.</div><button class="btn btn-primary" onclick="nav('dashboard')">Kembali ke Dashboard</button></div>`}
function renderProgress(){let done=Object.values(state.completed).filter(Boolean).length;view.innerHTML=`<div class="learning-banner"><div><span class="eyebrow">EVALUASI PROGRES</span><h2>Perjalanan Belajarmu</h2><p>Pantau materi yang telah diselesaikan dan hasil kuis setiap bagian.</p></div><div class="banner-emoji">🏆</div></div><div class="progress-card"><div class="progress-top"><span>Progress keseluruhan</span><span>${progress()}%</span></div><div class="bar"><span style="width:${progress()}%"></span></div><p style="font-size:11px;color:#88647b;margin:10px 0 0">${done} dari 4 materi telah ditandai selesai.</p></div><div class="cards">${["A","B","C","D"].map(k=>`<div class="lesson-card"><div class="card-top"><span class="letter">${k}</span><span class="card-icon"><i class="fa-solid fa-book"></i></span></div><h3>${titles[k]}</h3><p>Status materi: <b>${state.completed[k]?"Selesai":"Belum selesai"}</b></p><p>Nilai kuis: <b>${state.attempted[k]?state.scores[k]:"Belum dikerjakan"}</b></p><button class="btn btn-primary" onclick="nav('${k}')">Buka Materi</button></div>`).join("")}</div><div class="content-card" style="margin-top:18px"><h3>Pengaturan progres</h3><p>Progres disimpan di penyimpanan browser (LocalStorage) pada perangkat ini. Data tidak otomatis tersinkron ke perangkat lain.</p><button class="btn btn-light" onclick="resetProgress()"> <i class="fa-solid fa-rotate-left"></i> Reset Semua Progres</button></div>`}
function resetProgress(){if(confirm("Yakin ingin menghapus seluruh progres dan nilai kuis di perangkat ini?")){state={completed:{},scores:{},attempted:{}};answers={};save();window.showQuizResult=false;toast("Progres berhasil direset.");renderProgress()}}
document.getElementById("readBtn").onclick=()=>{if(!("speechSynthesis"in window)){toast("Browser tidak mendukung suara.");return}speechSynthesis.cancel();let textToRead=document.getElementById("view").innerText;let u=new SpeechSynthesisUtterance(textToRead);u.lang="id-ID";u.rate=.92;let v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith("id"));if(v)u.voice=v;speechSynthesis.speak(u);toast("Narasi halaman dimulai.")};
document.getElementById("stopReadBtn").onclick=()=>{if("speechSynthesis"in window)speechSynthesis.cancel();toast("Narasi dihentikan.")};
render();
</script>
